[workspace]
members = ["zed-extension"]
default-members = ["."]
resolver = "3"

[package]
name = "rs-gopls"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "rs-gopls"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.97"
regex = { version = "1", default-features = false, features = ["unicode-gencat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
url = "2"
